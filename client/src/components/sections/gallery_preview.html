<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AENIGRAVITY - Fullscreen Video Gallery</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            orbitron: ['Orbitron', 'sans-serif'],
            inter: ['Inter', 'sans-serif'],
          },
          colors: {
            cyanAccent: '#00FFD1',
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #050508;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }
    
    /* Custom Glow and Shadow Effects */
    .glow-cyan {
      box-shadow: 0 0 20px rgba(0, 255, 209, 0.2);
    }
    .glow-cyan-hover:hover {
      box-shadow: 0 0 30px rgba(0, 255, 209, 0.35);
      border-color: #00FFD1;
    }
    
    /* Custom scrollbar for beautiful styling */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #050508;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(0, 255, 209, 0.3);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 255, 209, 0.6);
    }
  </style>

  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel CDN for compiling JSX on the fly -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#050508] relative min-h-screen flex flex-col justify-between selection:bg-cyanAccent selection:text-black">

  <!-- Scanlines / Noise Overlay -->
  <div class="fixed inset-0 pointer-events-none opacity-[0.04] bg-[linear-gradient(rgba(18,16,16,0)_50%,rgba(0,0,0,0.5)_50%)] bg-[length:100%_4px] z-[999]"></div>

  <!-- Main Root Container for React App -->
  <div id="app-root" class="relative z-10 w-full flex-1 flex flex-col justify-center"></div>

  <!-- React Code using Babel -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    const MOCK_VIDEOS = [];
 
     function App() {
       const [selectedVideo, setSelectedVideo] = useState(null);
 
       // Keyboard ESC event handler to close the active video player
       useEffect(() => {
         const handleKeyDown = (e) => {
           if (e.key === 'Escape' && selectedVideo) {
             setSelectedVideo(null);
           }
         };
         window.addEventListener('keydown', handleKeyDown);
         return () => window.removeEventListener('keydown', handleKeyDown);
       }, [selectedVideo]);
 
       return (
         <div className="relative w-full max-w-7xl mx-auto my-8 p-6 md:p-10 bg-[#050508] border border-cyanAccent/20 rounded-[32px] overflow-hidden shadow-[0_0_60px_rgba(0,255,209,0.15)] min-h-[85vh] flex flex-col justify-between">
           
           {/* Ambient Glowing Orbs */}
           <div className="absolute -top-40 -left-40 w-96 h-96 bg-cyanAccent/5 rounded-full blur-[120px] pointer-events-none"></div>
           <div className="absolute -bottom-40 -right-40 w-96 h-96 bg-purple-600/5 rounded-full blur-[120px] pointer-events-none"></div>
 
           {/* Header */}
           <div className="flex items-center justify-between pb-8 border-b border-cyanAccent/10 relative z-10">
             <div>
               <p className="text-cyanAccent text-[10px] tracking-[0.4em] font-extrabold uppercase mb-1">
                 VIDEO EDITING GALLERY
               </p>
               <h1 className="text-3xl md:text-4xl font-black tracking-[0.2em] text-white font-orbitron uppercase relative inline-block">
                 AENIGRAVITY
                 <span className="absolute -bottom-1 left-0 right-0 h-[2px] bg-gradient-to-r from-transparent via-cyanAccent to-transparent shadow-[0_0_10px_#00FFD1]"></span>
               </h1>
             </div>
             
             <div className="flex items-center gap-3">
               <span className="hidden md:inline-flex rounded-full bg-cyanAccent/10 border border-cyanAccent/20 px-3 py-1 text-[10px] uppercase tracking-[0.2em] text-cyanAccent font-bold">
                 Standalone React Preview
               </span>
             </div>
           </div>
 
           {/* Video Grid */}
           <div className="flex-1 mt-10 relative z-10 flex flex-col justify-center">
             {MOCK_VIDEOS.length === 0 ? (
               <div className="text-center py-12 flex flex-col items-center justify-center">
                 {/* Glowing Cyan Trash/Empty Box Icon */}
                 <div className="w-20 h-20 rounded-full bg-cyanAccent/10 border border-cyanAccent/30 flex items-center justify-center mb-6 shadow-[0_0_20px_rgba(0,255,209,0.15)] animate-pulse">
                   <svg className="w-10 h-10 text-cyanAccent" fill="none" stroke="currentColor" strokeWidth="1.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                     <path strokeLinecap="round" strokeLinejoin="round" d="M20.25 7.5l-.625 10.632a2.25 2.25 0 01-2.247 2.118H6.622a2.25 2.25 0 01-2.247-2.118L3.75 7.5m8.25 3v6.75m0 0l-3-3m3 3l3-3M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125z" />
                   </svg>
                 </div>
                 <h4 className="text-2xl font-bold font-orbitron text-white uppercase tracking-wider mb-2">No videos yet</h4>
                 <p className="text-white/40 text-sm tracking-wide">Check back soon for new content.</p>
               </div>
             ) : (
               <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                 {MOCK_VIDEOS.map((video) => (
                   <div
                     key={video.id}
                     onClick={() => setSelectedVideo(video)}
                     className="group bg-black/40 border border-white/10 hover:border-cyanAccent rounded-[24px] overflow-hidden cursor-pointer transition-all duration-300 hover:shadow-[0_0_30px_rgba(0,255,209,0.25)] flex flex-col h-full transform hover:-translate-y-2"
                   >
                     {/* Thumbnail container */}
                     <div className="relative aspect-video w-full overflow-hidden bg-black/50">
                       <img
                         src={`https://img.youtube.com/vi/${video.id}/hqdefault.jpg`}
                         alt={video.name}
                         className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110"
                       />
 
                       {/* Play button hover overlay */}
                       <div className="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center">
                         <div className="w-14 h-14 rounded-full bg-cyanAccent/10 border border-cyanAccent flex items-center justify-center shadow-[0_0_15px_#00FFD1] transition-transform duration-300 group-hover:scale-110">
                           <svg className="w-6 h-6 text-cyanAccent fill-cyanAccent ml-1" viewBox="0 0 24 24">
                             <path d="M8 5v14l11-7z" />
                           </svg>
                         </div>
                       </div>
 
                       {/* Duration badge */}
                       <span className="absolute top-3 right-3 bg-black/85 border border-cyanAccent/30 text-cyanAccent text-[10px] font-bold px-2 py-0.5 rounded tracking-wider uppercase">
                         {video.duration}
                       </span>
 
                       {/* Category badge */}
                       <span className="absolute bottom-3 left-3 bg-black/85 border border-white/10 text-white/80 text-[9px] font-bold px-2 py-0.5 rounded uppercase tracking-widest">
                         {video.category}
                       </span>
                     </div>
 
                     {/* Text details */}
                     <div className="p-6 flex-1 flex flex-col justify-between bg-black/20">
                       <div>
                         <span className="text-cyanAccent text-[9px] font-extrabold tracking-[0.2em] uppercase mb-1.5 block">
                           {video.category}
                         </span>
                         <h4 className="text-md font-bold text-white tracking-wide group-hover:text-cyanAccent transition-colors line-clamp-1 uppercase font-orbitron">
                           {video.name}
                         </h4>
                         <p className="text-white/40 text-xs mt-2 leading-relaxed line-clamp-2">
                           {video.description}
                         </p>
                       </div>
                     </div>
                   </div>
                 ))}
               </div>
             )}
           </div>

          {/* Lightbox / Video Player Modal Overlay */}
          {selectedVideo && (
            <div className="fixed inset-0 bg-black/95 z-50 flex flex-col items-center justify-center p-6 md:p-12">
              
              {/* Scanlines overlay on player background */}
              <div className="absolute inset-0 pointer-events-none opacity-[0.04] bg-[linear-gradient(rgba(18,16,16,0)_50%,rgba(0,0,0,0.5)_50%)] bg-[length:100%_4px] z-[999]"></div>

              {/* Close Button top-right */}
              <button
                type="button"
                onClick={() => setSelectedVideo(null)}
                className="absolute top-6 right-6 md:right-12 rounded-full border border-cyanAccent/20 bg-black/40 p-3 text-white/80 hover:bg-white/10 hover:text-cyanAccent hover:border-cyanAccent hover:shadow-[0_0_15px_rgba(0,255,209,0.3)] transition-all duration-300 z-[1000]"
              >
                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2.5">
                  <path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
              </button>

              {/* Title display top-left */}
              <div className="absolute top-6 left-6 md:left-12 flex flex-col pointer-events-none">
                <span className="text-cyanAccent text-[10px] tracking-[0.4em] font-bold uppercase mb-1">
                  AENIGRAVITY THEATER
                </span>
                <span className="text-white/40 text-xs font-semibold hidden md:inline">
                  Press ESC to close theater mode
                </span>
              </div>

              {/* Player Box */}
              <div className="relative w-full max-w-5xl aspect-video rounded-[24px] overflow-hidden border border-cyanAccent/30 shadow-[0_0_50px_rgba(0,255,209,0.2)] bg-black">
                <iframe
                  className="w-full h-full"
                  src={`https://www.youtube.com/embed/${selectedVideo.id}?autoplay=1&rel=0`}
                  title={selectedVideo.name}
                  frameBorder="0"
                  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                  allowFullScreen
                ></iframe>
              </div>

              {/* Meta Info Below Player */}
              <div className="w-full max-w-5xl mt-6 p-6 rounded-[24px] border border-white/10 bg-[#0d0d0d]/80 backdrop-blur-md text-left relative z-10">
                <div className="flex flex-wrap items-center gap-3 mb-2">
                  <span className="inline-flex rounded-full bg-cyanAccent/15 px-3 py-1 text-[10px] uppercase tracking-[0.3em] text-cyanAccent font-bold">
                    {selectedVideo.category}
                  </span>
                  <span className="text-[10px] uppercase tracking-[0.2em] text-white/40 font-bold">
                    {selectedVideo.duration}
                  </span>
                </div>
                <h3 className="text-2xl font-black tracking-wider text-white uppercase font-orbitron">
                  {selectedVideo.name}
                </h3>
                <p className="text-white/60 text-sm mt-3 leading-relaxed">
                  {selectedVideo.description}
                </p>
              </div>

            </div>
          )}

          {/* Footer inside root */}
          <div className="text-center text-white/20 text-[10px] uppercase tracking-[0.25em] pt-8 border-t border-white/5 mt-10 relative z-10">
            AENIGRAVITY © 2026 / ALL RIGHTS RESERVED. DESIGN BY ANTIGRAVITY.
          </div>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('app-root'));
    root.render(<App />);
  </script>
</body>
</html>
